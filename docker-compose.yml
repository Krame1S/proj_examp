services:

  # ── Infrastructure ───────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI: http://localhost:15672
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Migrations (one-shot, runs before user_service starts) ───────────

  migrate:
    build:
      context: .                       # корень репо — чтобы shared был доступен
      dockerfile: user_service/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mydb
    env_file:
      - user_service/.env
    command: >
      sh -c "alembic upgrade head"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Gateway ──────────────────────────────────────────────────────────

  gateway:
    build:
      context: .                       # корень — чтобы скопировать shared/
      dockerfile: gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      RABBIT_AMQP: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      LOGGING_LEVEL: INFO
      CORS_ORIGINS: "*"
    restart: on-failure
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── User Service ─────────────────────────────────────────────────────

  user_service:
    build:
      context: .                       # корень — чтобы скопировать shared/ и keys/
      dockerfile: user_service/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mydb
      RABBIT_AMQP: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      LOGGING_LEVEL: INFO
      JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
    restart: on-failure
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ── Observability (опционально, можно закомментировать для быстрого теста) ──

