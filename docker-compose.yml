services:

  # ── Infrastructure ───────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s

  # ── Migrations ───────────────────────────────────────────────────────

  migrate_user:
    build:
      context: .
      dockerfile: user_service/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mydb
    command: sh -c "alembic upgrade head"
    depends_on:
      postgres:
        condition: service_healthy

  migrate_category:
    build:
      context: .
      dockerfile: category_service/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mydb
    command: sh -c "alembic upgrade head"
    depends_on:
      postgres:
        condition: service_healthy

  migrate_task:
    build:
      context: .
      dockerfile: task_service/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mydb
    command: sh -c "alembic upgrade head"
    depends_on:
      postgres:
        condition: service_healthy

  migrate_tag:
    build:
      context: .
      dockerfile: tag_service/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mydb
    command: sh -c "alembic upgrade head"
    depends_on:
      postgres:
        condition: service_healthy

  migrate_comment:
    build:
      context: .
      dockerfile: comment_service/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mydb
    command: sh -c "alembic upgrade head"
    depends_on:
      postgres:
        condition: service_healthy

  migrate_attachment:
    build:
      context: .
      dockerfile: attachment_service/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mydb
    command: sh -c "alembic upgrade head"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Gateway ──────────────────────────────────────────────────────────

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      RABBIT_AMQP: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      LOGGING_LEVEL: INFO
      CORS_ORIGINS: "*"
      ENABLE_TRACING: "true"
      MOCK_S3: "true"
    restart: always
    depends_on:
      - rabbitmq
      - redis
      - jaeger

  # ── User Service ─────────────────────────────────────────────────────

  user_service:
    build:
      context: .
      dockerfile: user_service/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mydb
      RABBIT_AMQP: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      LOGGING_LEVEL: INFO
      JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
    restart: always
    depends_on:
      - rabbitmq
      - postgres
      - redis
      - migrate_user

  # ── Task Service ─────────────────────────────────────────────────────

  task_service:
    build:
      context: .
      dockerfile: task_service/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mydb
      RABBIT_AMQP: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      LOGGING_LEVEL: INFO
    restart: always
    depends_on:
      - rabbitmq
      - postgres
      - migrate_task

  # ── Category Service ─────────────────────────────────────────────────

  category_service:
    build:
      context: .
      dockerfile: category_service/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mydb
      RABBIT_AMQP: amqp://guest:guest@rabbitmq:5672/
      LOGGING_LEVEL: INFO
    restart: always
    depends_on:
      - rabbitmq
      - postgres
      - migrate_category

  # ── Tag Service ──────────────────────────────────────────────────────

  tag_service:
    build:
      context: .
      dockerfile: tag_service/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mydb
      RABBIT_AMQP: amqp://guest:guest@rabbitmq:5672/
      LOGGING_LEVEL: INFO
    restart: always
    depends_on:
      - rabbitmq
      - postgres
      - migrate_tag

  comment_service:
    build:
      context: .
      dockerfile: comment_service/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mydb
      RABBIT_AMQP: amqp://guest:guest@rabbitmq:5672/
      LOGGING_LEVEL: INFO
    restart: always
    depends_on:
      - rabbitmq
      - postgres
      - migrate_comment

  attachment_service:
    build:
      context: .
      dockerfile: attachment_service/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mydb
      RABBIT_AMQP: amqp://guest:guest@rabbitmq:5672/
      LOGGING_LEVEL: INFO
      MOCK_S3: "true" 
    restart: always
    depends_on:
      - rabbitmq
      - postgres
      - migrate_attachment


  # ── Observability (опционально, можно закомментировать для быстрого теста) ──

  jaeger:
    image: jaegertracing/all-in-one:1.58
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
    volumes:
      - jaegerdata:/data

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafanadata:/var/lib/grafana

  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - lokidata:/loki

  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-config.yaml:/etc/promtail/config.yaml:ro
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  prometheusdata:
  grafanadata:
  jaegerdata:
  lokidata: