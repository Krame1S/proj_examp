[tool.poetry]
name = "user-service"
version = "0.1.0"
description = ""
authors = ["Your Name <your@email.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
# Database
asyncpg = "^0.31"
sqlalchemy = "^2.0"
alembic = "^1.14"
# Auth
pyjwt = { version = "^2.10", extras = ["crypto"] }
passlib = { version = "^1.7", extras = ["argon2"] }
argon2-cffi = "^23.1"
# Validation
pydantic = "^2.10"
pydantic-settings = "^2.7"
email-validator = "^2.2"
# Queue
aio-pika = "^9.6.2"
# Logging
colorama = "^0.4"
# Redis
redis = "^5.2"
# Tracing
opentelemetry-api = "^1.25"
opentelemetry-sdk = "^1.25"
opentelemetry-exporter-otlp-proto-grpc = "^1.25"
opentelemetry-instrumentation-asyncpg = "^0.63b1"

[tool.poetry.group.dev.dependencies]
ruff = "^0.11"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
mypy_path = "../shared/src"


[tool.ruff]
exclude = [
    ".env",
    ".git",
]
line-length = 120
indent-width = 4
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint]
extend-select = [
    "E",
    "C",
    "F",
    "I",
    "N",
    "UP",
    "TRY",
    "FURB",
    "PLW",
    "C4",
    "B",
    "RSE",
    "SIM",
    "C90",
]
ignore = ["TRY003", "TRY301"]

[tool.ruff.lint.mccabe]
max-complexity = 6
